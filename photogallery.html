<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="./img/favicon.ico">
  <title>My portfolio - Photo Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/style.production.css">

  <style>
    /* ===== Gallery Layout ===== */
    .gallery-section {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .gallery-section h1 {
      margin-bottom: 25px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.2s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.03);
    }

    .gallery-item figcaption {
      margin-top: 8px;
      font-size: 14px;
    }

    /* ===== Lightbox ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
    }

    .lightbox__caption {
      color: white;
      margin-top: 15px;
      text-align: center;
    }

    .lightbox__close {
      position: absolute;
      top: 25px;
      right: 40px;
      font-size: 40px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header class="page-header">
    <img src="./img/JettBerg-text.PNG" class="page-header__item"
      alt="Personal logo of Jett Berg">

    <nav class="main navigation page-header__item">
      <ul role="menubar" class="navigation-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About me</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="work.html">My work</a></li>
        <li><a href="photogallery.html" class="navigation-list__item--active">Photo gallery</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== Hiking & Camping ===== -->
  <section class="gallery-section page-container">
    <h1>Hiking and Camping</h1>

    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="./img/AvalancheLake.PNG" alt="Avalanche Lake, Glacier National Park">
        <figcaption>Avalanche Lake, Glacier National Park</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/campsite.PNG" alt="Campsite in Flathead National Forest, Montana">
        <figcaption>Campsite in Flathead National Forest, Montana</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/MountainView.PNG" alt="Favorite Glacier view">
        <figcaption>Favorite view in Glacier National Park</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/ThreeTents.PNG" alt="Backpacking in Grand Lake Colorado">
        <figcaption>Backpacking in Grand Lake, Colorado</figcaption>
      </figure>

    </div>
  </section>

  <!-- ===== Friends & Family ===== -->
  <section class="gallery-section page-container">
    <h1>Time with Friends and Family</h1>

    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="./img/SiblingSOs.PNG" alt="Family wedding">
        <figcaption>Family wedding</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Daytona.PNG" alt="Spring break Daytona">
        <figcaption>Spring break in Daytona</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/GusNF.PNG" alt="Concert with friend">
        <figcaption>Concert with a friend</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Megan.PNG" alt="Wedding with girlfriend">
        <figcaption>Wedding with Megan</figcaption>
      </figure>

    </div>
  </section>

  <!-- ===== Traveling ===== -->
  <section class="gallery-section page-container">
    <h1>Traveling</h1>

    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="./img/Banff.PNG" alt="Banff Canada">
        <figcaption>Banff, Canada</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Alaska.PNG" alt="Denali Alaska">
        <figcaption>Denali National Park</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Bahamas.PNG" alt="Bahamas trip">
        <figcaption>Bahamas getaway</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Chicago.PNG" alt="Chicago">
        <figcaption>Chicago trip</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Ontario.PNG" alt="Fishing Ontario">
        <figcaption>Fishing in Ontario</figcaption>
      </figure>

    </div>
  </section>

  <!-- ===== Scrapbook ===== -->
  <section class="gallery-section page-container">
    <h1>Scrapbook</h1>

    <div class="gallery-grid">

      <figure class="gallery-item">
        <img src="./img/Scrap3.PNG" alt="Scrapbook page 1">
        <figcaption>Scrapbook page</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Scrap4.PNG" alt="Scrapbook page 2">
        <figcaption>Family wedding scrapbook</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="./img/Scrap5.PNG" alt="Scrapbook page 3">
        <figcaption>Fishing trip scrapbook</figcaption>
      </figure>

    </div>
  </section>

  <!-- ===== Lightbox ===== -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox__close">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption" class="lightbox__caption"></p>
  </div>

  <script>
    const items = document.querySelectorAll('.gallery-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const caption = document.getElementById('lightbox-caption');
    const closeBtn = document.querySelector('.lightbox__close');

    items.forEach(img => {
      img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
        caption.textContent = img.alt;
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
      }
    });
  </script>

</body>
</html>
